# Color scheme

[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml",
]

# Display

[window]
dimensions = { columns = 120, lines = 35 }
dynamic_padding = true
padding = { x = 6, y = 6 }
dynamic_title = true

[font]
size = 12.0

[cursor]
blink_interval = 750
unfocused_hollow = true

[cursor.style]
blinking = "On"

# Behavior

[selection]
save_to_clipboard = true
